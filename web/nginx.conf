# Serves the built React bundle and reverse-proxies the API on the same origin.
#
# Why a proxy instead of pointing the browser straight at the API:
# web/src/api.ts resolves its base URL from import.meta.env.VITE_API_BASE_URL, which Vite
# inlines at BUILD time, not at container start. Baking an absolute URL in would mean the
# image only works on a host where the API is published at exactly that address, and would
# put the browser on a different origin from the API — which then needs a CORS policy that
# exists only to serve the demo. Leaving VITE_API_BASE_URL unset makes api.ts issue a
# same-origin request to /api/claims, which this server forwards to the api service over the
# compose network. One origin, no CORS, and the image is portable.
#
# Listens on 8080, not 80: this runs as the unprivileged nginx user, which cannot bind a
# port below 1024. Compose publishes host 5173 -> 8080.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Long-lived immutable assets: Vite content-hashes these filenames, so a changed file
    # is a changed URL and this can never serve a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a reviewer who reloads after a rebuild gets an
    # HTML file referencing asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass         http://${API_UPSTREAM}/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A claim submission is a single small POST; it should surface a dead API quickly
        # rather than leaving the reviewer looking at a spinner.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Buffering off so an API error body reaches the browser immediately.
        proxy_buffering off;
    }

    # Lets the compose healthcheck prove nginx is serving without depending on the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback. Must come last: any path that is not a real file is handed to the
    # React router rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
